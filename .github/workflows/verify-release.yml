name: Verify release target

on:
  workflow_call:
    inputs:
      product:
        description: Product to verify (all, main, rsgl, or rsgl-cli)
        required: true
        type: string
      upload_artifacts:
        description: Retain smoke-test packages for inspection
        required: false
        default: false
        type: boolean
      source_ref:
        description: Exact source ref to verify; defaults to the caller commit
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.product }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Validate target
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          case "${PRODUCT}" in
            all|main|rsgl|rsgl-cli) ;;
            *) echo "Unsupported product: ${PRODUCT}"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode-rsgl/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install RSGL extension dependencies
        run: npm ci --prefix extensions/vscode-rsgl

      - name: Test
        run: npm test

      - name: Package main extension
        if: inputs.product == 'all' || inputs.product == 'main'
        run: npm run package:main:vsix -- --out dist/minecraft-resourcepack-helper-${{ runner.os }}.vsix

      - name: Verify main extension package
        if: inputs.product == 'all' || inputs.product == 'main'
        run: npm run verify:main:vsix -- dist/minecraft-resourcepack-helper-${{ runner.os }}.vsix

      - name: Package RSGL extension
        if: inputs.product == 'all' || inputs.product == 'rsgl'
        run: npm run package:rsgl:vsix -- --out dist/rsgl-${{ runner.os }}.vsix

      - name: Verify RSGL extension package
        if: inputs.product == 'all' || inputs.product == 'rsgl'
        run: npm run verify:rsgl:vsix -- dist/rsgl-${{ runner.os }}.vsix

      - name: Package RSGL CLI
        if: inputs.product == 'all' || inputs.product == 'rsgl-cli'
        run: npm run package:rsgl-cli -- --out dist/rsgl-cli-${{ runner.os }}.tgz

      - name: Verify RSGL CLI package
        if: inputs.product == 'all' || inputs.product == 'rsgl-cli'
        run: npm run verify:rsgl-cli -- dist/rsgl-cli-${{ runner.os }}.tgz

      - name: Upload smoke-test packages
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ inputs.product }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
