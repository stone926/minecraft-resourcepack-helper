name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install RSGL extension dependencies
        run: npm ci --prefix extensions/vscode-rsgl

      - name: Test
        run: npm test

      - name: Compile RSGL extension
        run: npm run compile:rsgl-extension

      - name: Package VSIX smoke test
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          npm run package:main:vsix -- --out dist/minecraft-resourcepack-helper-ci.vsix
          npm run package:rsgl:vsix -- --out dist/rsgl-ci.vsix

      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-ci-vsix
          path: |
            dist/minecraft-resourcepack-helper-ci.vsix
            dist/rsgl-ci.vsix
          if-no-files-found: error
          retention-days: 7
