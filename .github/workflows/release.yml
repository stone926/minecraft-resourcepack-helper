name: Release

on:
  push:
    tags:
      - "v*"
      - "rsgl-cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z or rsgl-cli-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      product: ${{ steps.contract.outputs.product }}
      version: ${{ steps.contract.outputs.version }}
      tag: ${{ steps.contract.outputs.tag }}
      publish_kind: ${{ steps.contract.outputs.publish_kind }}
      asset_name: ${{ steps.contract.outputs.asset_name }}
      marketplace_publisher: ${{ steps.contract.outputs.marketplace_publisher }}
      marketplace_extension: ${{ steps.contract.outputs.marketplace_extension }}
      commit: ${{ steps.contract.outputs.commit }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate tag and manifest version
        id: contract
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release-contract.mjs describe --tag "${RELEASE_TAG}" --verify-git --output "${GITHUB_OUTPUT}"

  verify:
    name: Cross-platform release gate
    needs: contract
    uses: ./.github/workflows/verify-release.yml
    with:
      product: ${{ needs.contract.outputs.product }}
      source_ref: ${{ needs.contract.outputs.commit }}

  build:
    name: Build immutable release artifact
    needs:
      - contract
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      publisher_sha256: ${{ steps.publisher.outputs.sha256 }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.contract.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/vsce-publisher/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Marketplace publishing client
        if: needs.contract.outputs.publish_kind == 'marketplace'
        run: npm ci --prefix tools/vsce-publisher --ignore-scripts

      - name: Smoke test pinned Marketplace publishing client
        if: needs.contract.outputs.publish_kind == 'marketplace'
        run: node tools/vsce-publisher/node_modules/@vscode/vsce/vsce --version

      - name: Archive pinned Marketplace publishing client
        if: needs.contract.outputs.publish_kind == 'marketplace'
        id: publisher
        shell: bash
        run: |
          mkdir -p release
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -czf release-vsce-publisher.tgz -C tools/vsce-publisher node_modules package.json package-lock.json
          mv release-vsce-publisher.tgz release/vsce-publisher.tgz
          echo "sha256=$(sha256sum release/vsce-publisher.tgz | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Package selected product
        shell: bash
        env:
          PRODUCT: ${{ needs.contract.outputs.product }}
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
        run: node scripts/artifact.mjs package "${PRODUCT}" --out "release/${ASSET_NAME}"

      - name: Verify selected product
        shell: bash
        env:
          PRODUCT: ${{ needs.contract.outputs.product }}
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
        run: node scripts/artifact.mjs verify "${PRODUCT}" "release/${ASSET_NAME}"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
        run: node scripts/release-contract.mjs notes --tag "${RELEASE_TAG}" --output release/release-notes.md

      - name: Generate SHA-256 digest
        id: digest
        shell: bash
        env:
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
        run: |
          SHA256="$(node scripts/release-contract.mjs digest --asset "release/${ASSET_NAME}" --output release/SHA256SUMS)"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.contract.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish_marketplace:
    name: Publish ${{ needs.contract.outputs.product }} to Marketplace
    needs:
      - contract
      - build
    if: needs.contract.outputs.publish_kind == 'marketplace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download immutable artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release

      - name: Verify artifact SHA-256
        shell: bash
        env:
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          EXPECTED_RECORD="${EXPECTED_SHA256}  ${ASSET_NAME}"
          test "$(cat release/SHA256SUMS)" = "${EXPECTED_RECORD}"
          printf '%s\n' "${EXPECTED_RECORD}" | (cd release && sha256sum --check -)

      - name: Verify and extract pinned Marketplace publishing client
        shell: bash
        env:
          EXPECTED_PUBLISHER_SHA256: ${{ needs.build.outputs.publisher_sha256 }}
        run: |
          test -n "${EXPECTED_PUBLISHER_SHA256}"
          printf '%s  %s\n' "${EXPECTED_PUBLISHER_SHA256}" vsce-publisher.tgz \
            | (cd release && sha256sum --check -)
          mkdir -p release/vsce-publisher
          tar -xzf release/vsce-publisher.tgz -C release/vsce-publisher

      - name: Revalidate immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          CURRENT_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "${CURRENT_COMMIT}" = "${EXPECTED_COMMIT}"

      - name: Setup Node.js publishing client
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify an existing Marketplace artifact is identical
        id: marketplace
        shell: bash
        env:
          MARKETPLACE_PUBLISHER: ${{ needs.contract.outputs.marketplace_publisher }}
          MARKETPLACE_EXTENSION: ${{ needs.contract.outputs.marketplace_extension }}
          RELEASE_VERSION: ${{ needs.contract.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          PACKAGE_URL="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/${MARKETPLACE_PUBLISHER}/vsextensions/${MARKETPLACE_EXTENSION}/${RELEASE_VERSION}/vspackage"
          STATUS="$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 300 \
            --output release/marketplace-existing.vsix \
            --write-out '%{http_code}' "${PACKAGE_URL}")"
          case "${STATUS}" in
            200)
              PUBLISHED_SHA256="$(sha256sum release/marketplace-existing.vsix | cut -d ' ' -f 1)"
              test "${PUBLISHED_SHA256}" = "${EXPECTED_SHA256}"
              echo "already_published=true" >> "${GITHUB_OUTPUT}"
              echo "Marketplace already contains the verified artifact; continuing."
              ;;
            404)
              rm -f release/marketplace-existing.vsix
              echo "already_published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected Marketplace response: HTTP ${STATUS}" >&2
              exit 1
              ;;
          esac

      - name: Publish to VS Code Marketplace
        if: steps.marketplace.outputs.already_published != 'true'
        env:
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node release/vsce-publisher/node_modules/@vscode/vsce/vsce publish --packagePath "release/${ASSET_NAME}"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
          EXPECTED_COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          CURRENT_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "${CURRENT_COMMIT}" = "${EXPECTED_COMMIT}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file release/release-notes.md
            gh release upload "${RELEASE_TAG}" "release/${ASSET_NAME}" release/SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" "release/${ASSET_NAME}" release/SHA256SUMS \
              --title "${RELEASE_TAG}" --notes-file release/release-notes.md --verify-tag
          fi

  publish_cli:
    name: Publish RSGL CLI to npm
    needs:
      - contract
      - build
    if: needs.contract.outputs.publish_kind == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download immutable artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release

      - name: Verify artifact SHA-256
        shell: bash
        env:
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          EXPECTED_RECORD="${EXPECTED_SHA256}  ${ASSET_NAME}"
          test "$(cat release/SHA256SUMS)" = "${EXPECTED_RECORD}"
          printf '%s\n' "${EXPECTED_RECORD}" | (cd release && sha256sum --check -)

      - name: Revalidate immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          CURRENT_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "${CURRENT_COMMIT}" = "${EXPECTED_COMMIT}"

      - name: Setup Node.js publishing client
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish RSGL CLI to npm
        shell: bash
        env:
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
          RELEASE_VERSION: ${{ needs.contract.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_SPEC="@minecraft-resourcepack-helper/rsgl-cli@${RELEASE_VERSION}"
          if PUBLISHED_JSON="$(npm view "${PACKAGE_SPEC}" dist.integrity --json 2>/dev/null)"; then
            PUBLISHED_INTEGRITY="$(printf '%s' "${PUBLISHED_JSON}" | tr -d '"\r\n')"
          else
            PUBLISHED_INTEGRITY=""
          fi
          if [[ "${PUBLISHED_INTEGRITY}" == sha512-* ]]; then
            LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "release/${ASSET_NAME}" | base64 -w 0)"
            test "${PUBLISHED_INTEGRITY}" = "${LOCAL_INTEGRITY}"
            echo "${PACKAGE_SPEC} is already published with the verified artifact; continuing."
          elif test -n "${PUBLISHED_INTEGRITY}" && test "${PUBLISHED_INTEGRITY}" != "null"; then
            echo "Unexpected registry integrity response for ${PACKAGE_SPEC}: ${PUBLISHED_INTEGRITY}" >&2
            exit 1
          else
            npm publish "release/${ASSET_NAME}" --access public --provenance
          fi

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.contract.outputs.tag }}
          ASSET_NAME: ${{ needs.contract.outputs.asset_name }}
          EXPECTED_COMMIT: ${{ needs.contract.outputs.commit }}
        run: |
          CURRENT_COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          test "${CURRENT_COMMIT}" = "${EXPECTED_COMMIT}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes-file release/release-notes.md
            gh release upload "${RELEASE_TAG}" "release/${ASSET_NAME}" release/SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" "release/${ASSET_NAME}" release/SHA256SUMS \
              --title "${RELEASE_TAG}" --notes-file release/release-notes.md --verify-tag
          fi
