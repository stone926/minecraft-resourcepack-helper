name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.3.4"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish VS Code extensions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag ${RELEASE_TAG} does not exist."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]; then
            echo "Release tag ${RELEASE_TAG} does not point to the checked-out commit."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode-rsgl/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install RSGL extension dependencies
        run: npm ci --prefix extensions/vscode-rsgl

      - name: Test
        run: npm test

      - name: Compile RSGL extension
        run: npm run compile:rsgl-extension

      - name: Read package metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          RSGL_VERSION="$(node -p "require('./extensions/vscode-rsgl/package.json').version")"
          RSGL_NAME="$(node -p "require('./extensions/vscode-rsgl/package.json').name")"
          TAG="${RELEASE_TAG}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match package version ${VERSION}."
            exit 1
          fi
          if [ "${RSGL_VERSION}" != "${VERSION}" ]; then
            echo "RSGL extension version ${RSGL_VERSION} does not match package version ${VERSION}."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "rsgl_version=${RSGL_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "rsgl_name=${RSGL_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "main_vsix=dist/${NAME}-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"
          echo "rsgl_vsix=dist/${RSGL_NAME}-${RSGL_VERSION}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Package VSIX artifacts
        env:
          MAIN_VSIX: ${{ steps.meta.outputs.main_vsix }}
          RSGL_VSIX: ${{ steps.meta.outputs.rsgl_vsix }}
        run: |
          mkdir -p dist
          npm run package:main:vsix -- --out "${MAIN_VSIX}"
          npm run package:rsgl:vsix -- --out "${RSGL_VSIX}"
          npm run verify:rsgl:vsix -- "${RSGL_VSIX}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extensions-${{ steps.meta.outputs.version }}-vsix-${{ github.run_attempt }}
          path: |
            ${{ steps.meta.outputs.main_vsix }}
            ${{ steps.meta.outputs.rsgl_vsix }}
          if-no-files-found: error
          retention-days: 30

      - name: Check Marketplace token
        shell: bash
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "Missing VSCE_PAT repository secret."
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish RSGL extension to VS Code Marketplace
        run: npm run deploy -- --packagePath "${RSGL_VSIX}" --skip-duplicate
        env:
          RSGL_VSIX: ${{ steps.meta.outputs.rsgl_vsix }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish main extension to VS Code Marketplace
        run: npm run deploy -- --packagePath "${MAIN_VSIX}" --skip-duplicate
        env:
          MAIN_VSIX: ${{ steps.meta.outputs.main_vsix }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = process.env.VERSION;
          const tag = process.env.TAG;
          const changelogPath = "CHANGELOG.md";
          const fallback = `Release ${tag}\n`;

          if (!fs.existsSync(changelogPath)) {
            fs.writeFileSync("release-notes.md", fallback);
            process.exit(0);
          }

          const content = fs.readFileSync(changelogPath, "utf8").replace(/\r\n/g, "\n");
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const headingRegex = new RegExp(`^## \\[${escapedVersion}\\][^\\n]*\\n`, "m");
          const headingMatch = headingRegex.exec(content);
          let notes = "";

          if (headingMatch) {
            const bodyStart = headingMatch.index + headingMatch[0].length;
            const nextHeadingRegex = /^## \[/gm;
            nextHeadingRegex.lastIndex = bodyStart;

            const nextHeadingMatch = nextHeadingRegex.exec(content);
            const bodyEnd = nextHeadingMatch ? nextHeadingMatch.index : content.length;
            notes = content.slice(bodyStart, bodyEnd).trim();
          }

          fs.writeFileSync("release-notes.md", notes ? `${notes}\n` : fallback);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          MAIN_VSIX: ${{ steps.meta.outputs.main_vsix }}
          RSGL_VSIX: ${{ steps.meta.outputs.rsgl_vsix }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md
            gh release upload "${TAG}" "${MAIN_VSIX}" "${RSGL_VSIX}" --clobber
          else
            gh release create "${TAG}" "${MAIN_VSIX}" "${RSGL_VSIX}" --title "${TAG}" --notes-file release-notes.md --verify-tag
          fi
